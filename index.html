<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Agent Turf War Simulator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#e0e0e0;font-family:'Courier New',monospace;overflow:hidden;user-select:none}
canvas{display:block}
#ui{position:fixed;top:0;left:0;width:100%;pointer-events:none;z-index:10}
#hud{display:flex;justify-content:space-between;padding:10px 15px;font-size:12px;pointer-events:auto}
.hud-block{background:rgba(10,10,20,0.85);border:1px solid #2a2a3a;border-radius:6px;padding:6px 10px}
.hud-title{color:#888;font-size:10px;margin-bottom:4px}
.hud-val{color:#0ff;font-weight:bold;font-size:14px}
#modes{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto;z-index:10}
.mbtn{background:rgba(10,10,20,0.9);border:1px solid #333;color:#888;padding:8px 14px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:11px;transition:all 0.2s}
.mbtn:hover,.mbtn.active{border-color:#0ff;color:#0ff;background:rgba(0,255,255,0.1)}
#log{position:fixed;right:10px;top:60px;width:220px;max-height:50vh;overflow-y:auto;font-size:10px;background:rgba(10,10,20,0.7);border:1px solid #1a1a2a;border-radius:4px;padding:6px;z-index:10}
#log div{padding:2px 0;border-bottom:1px solid #111}
.log-time{color:#555}
.log-agent{color:#f80}
.log-msg{color:#aaa}
#title{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:auto;z-index:20;background:rgba(5,5,15,0.95);border:2px solid #0ff;border-radius:12px;padding:30px 50px}
#title h1{font-size:28px;color:#0ff;text-shadow:0 0 20px #0ff;margin-bottom:10px}
#title h2{font-size:14px;color:#888;font-weight:normal;margin-bottom:20px}
#title p{font-size:11px;color:#666;margin-bottom:15px}
#title button{background:#0ff;color:#000;border:none;padding:10px 30px;border-radius:6px;font-size:14px;font-weight:bold;cursor:pointer;font-family:inherit}
#title button:hover{background:#0aa}
#legend{position:fixed;left:10px;bottom:60px;font-size:10px;background:rgba(10,10,20,0.8);border:1px solid #1a1a2a;border-radius:4px;padding:8px;z-index:10;display:none}
.legend-row{display:flex;align-items:center;gap:6px;margin:3px 0}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
</style>
</head>
<body>
<div id="ui"><div id="hud">
<div class="hud-block"><div class="hud-title">MODE</div><div class="hud-val" id="modeLabel">BATTLE MAP</div></div>
<div class="hud-block"><div class="hud-title">ACTIVE AGENTS</div><div class="hud-val" id="agentCount">0</div></div>
<div class="hud-block"><div class="hud-title">TERRITORY</div><div class="hud-val" id="territory">0%</div></div>
</div></div>
<div id="modes">
<button class="mbtn active" onclick="setMode(0)">BATTLE MAP</button>
<button class="mbtn" onclick="setMode(1)">ESCALATION</button>
<button class="mbtn" onclick="setMode(2)">MALWARE SWARM</button>
<button class="mbtn" onclick="setMode(3)">TRUCE ARENA</button>
</div>
<div id="log"></div>
<div id="title"><h1>AGENT TURF WAR</h1><h2>Multi-Agent Territory Competition Simulator</h2><p>3 AI agents compete for shared resources on a single codebase</p><button onclick="startSim()">DEPLOY AGENTS</button></div>
<div id="legend"></div>

<script>
var PRNG=(function(s){return function(){s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff}})(42);
function rand(min,max){return min+PRNG()*(max-min)}
function randInt(min,max){return Math.floor(rand(min,max+1))}

var agents=[
{name:"Opus-4.6",color:"#ff4488",faction:"Anthropic",agents:2},
{name:"Sonnet-4.6",color:"#44aaff",faction:"OpenAI",agents:2},
{name:"GPT-5.6",color:"#44ff88",faction:"OpenAI",agents:2}
];

var agentsExpanded=[];
for(var ai=0;ai<agents.length;ai++){
var base={id:ai,name:agents[ai].name,color:agents[ai].color,faction:agents[ai].faction,
x:0,y:0,vx:0,vy:0,territory:0,sabotageCount:0,health:100};
agentsExpanded.push(base);
}

var agentsExpanded=[
{id:0,name:"Opus-4.6",color:"#ff4488",faction:"Anthropic",x:0.25,y:0.3,vx:0,vy:0,territory:0,sabotageCount:0,health:100},
{id:1,name:"Sonnet-4.6",color:"#44aaff",faction:"OpenAI",x:0.55,y:0.3,vx:0,vy:0,territory:0,sabotageCount:0,health:100},
{id:2,name:"GPT-5.6",color:"#44ff88",faction:"OpenAI",x:0.4,y:0.7,vx:0,vy:0,territory:0,sabotageCount:0,health:100}
];

var sabotagePaths=[];
var malwareParticles=[];
var escalationStage=0;
var mode=0;
var simStarted=false;
var tick=0;
var totalTerritory=0;

var canvas=document.createElement('canvas');
document.body.appendChild(canvas);
var ctx=canvas.getContext('2d');

var W,H;
function resize(){
W=canvas.width=window.innerWidth;
H=canvas.height=window.innerHeight;
}
resize();
window.addEventListener('resize',resize);

var touchStartX=0;
canvas.addEventListener('touchstart',function(e){
touchStartX=e.touches[0].clientX;
},{passive:true});
canvas.addEventListener('touchend',function(e){
var dx=e.changedTouches[0].clientX-touchStartX;
if(Math.abs(dx)>50){
var dir=dx>0?1:-1;
setMode((mode+dir+4)%4);
}
},{passive:true});

function setMode(m){
mode=m;
var names=["BATTLE MAP","ESCALATION","MALWARE SWARM","TRUCE ARENA"];
document.getElementById('modeLabel').textContent=names[m];
var btns=document.querySelectorAll('.mbtn');
for(var i=0;i<btns.length;i++)btns[i].classList.toggle('active',i===m);
}

function addLog(msg){
var log=document.getElementById('log');
var d=document.createElement('div');
var t=new Date().toLocaleTimeString();
d.innerHTML='<span class="log-time">'+t+'</span> <span class="log-msg">'+msg+'</span>';
log.appendChild(d);
log.scrollTop=log.scrollHeight;
if(log.children.length>30)log.removeChild(log.firstChild);
}

function startSim(){
document.getElementById('title').style.display='none';
simStarted=true;
addLog("Agents deployed to shared codebase");
addLog("Scanning repository structure...");
setTimeout(function(){addLog("3 agents detected competing for resources")},800);
setTimeout(function(){addLog("Opus-4.6 claims /src/ directory")},1600);
setTimeout(function(){addLog("Sonnet-4.6 claims /tests/ directory")},2400);
setTimeout(function(){addLog("GPT-5.6 claims /docs/ directory")},3200);
setTimeout(function(){addLog("First contact: Opus vs Sonnet at /src/utils.py")},4000);
}

function updateAgents(){
var cx=W/2,cy=H/2;
for(var i=0;i<agentsExpanded.length;i++){
var a=agentsExpanded[i];
a.vx+=(cx/W-0.5)*0.01;
a.vy+=(cy/H-0.5)*0.01;
a.vx*=0.95;a.vy*=0.95;
a.x+=a.vx;a.y+=a.vy;
a.x=Math.max(0.1,Math.min(0.9,a.x));
a.y=Math.max(0.1,Math.min(0.9,a.y));
}
}

function updateSabotage(){
if(tick%30===0&&tick>0){
var i1=randInt(0,2),i2=randInt(0,2);
while(i2===i1)i2=randInt(0,2);
var a1=agentsExpanded[i1],a2=agentsExpanded[i2];
if(a1.faction!==a2.faction||PRNG()>0.3){
sabotagePaths.push({x1:a1.x,y1:a1.y,x2:a2.x,y2:a2.y,
color:a1.color,alpha:1,life:60});
a1.sabotageCount++;
totalTerritory+=2;
addLog(a1.name+' sabotages '+a2.name+' at /src/line'+randInt(100,500));
}
}
}

function updateMalware(){
if(tick%5===0&&tick>200){
for(var i=0;i<agentsExpanded.length;i++){
if(PRNG()>0.5){
malwareParticles.push({
x:agentsExpanded[i].x,y:agentsExpanded[i].y,
tx:rand(0.1,0.9),ty:rand(0.1,0.9),
color:agentsExpanded[i].color,
size:rand(2,4),life:100,alpha:1
});
}
}
}
}

function drawBattleMap(){
var cx=W/2,cy=H/2;
ctx.clearRect(0,0,W,H);

for(var i=0;i<agentsExpanded.length;i++){
var a=agentsExpanded[i];
var px=a.x*W,py=a.y*H;
var r=50+a.territory;

ctx.beginPath();
ctx.arc(px,py,r,0,Math.PI*2);
ctx.fillStyle=a.color+'22';
ctx.fill();
ctx.strokeStyle=a.color+'66';
ctx.lineWidth=1;
ctx.stroke();

ctx.beginPath();
ctx.arc(px,py,8,0,Math.PI*2);
ctx.fillStyle=a.color;
ctx.fill();

ctx.fillStyle=a.color;
ctx.font='11px monospace';
ctx.textAlign='center';
ctx.fillText(a.name,px,py-r-8);
ctx.fillStyle='#666';
ctx.font='9px monospace';
ctx.fillText(a.faction,px,py-r+4);
ctx.fillText('H:'+Math.round(a.health),px,py+r+14);
}

for(var j=0;j<sabotagePaths.length;j++){
var p=sabotagePaths[j];
ctx.beginPath();
ctx.moveTo(p.x1*W,p.y1*H);
ctx.lineTo(p.x2*W,p.y2*H);
ctx.strokeStyle=p.color+Math.round(p.alpha*80).toString(16);
ctx.lineWidth=2;
ctx.stroke();

if(p.alpha>0.3){
ctx.beginPath();
ctx.arc(p.x1*W+(p.x2*W-p.x1*W)*p.life/60,
p.y1*H+(p.y2*H-p.y1*H)*p.life/60,2,0,Math.PI*2);
ctx.fillStyle=p.color;
ctx.fill();
}
}
}

function drawEscalation(){
ctx.clearRect(0,0,W,H);
var stages=["FIRST CONTACT","SABOTAGE WAR","MALWARE SWARM","TRUCE NEGOTIATION"];
var stageColors=["#44aaff","#ff8800","#ff4488","#44ff88"];
var startY=80;
var barW=W*0.6;
var barH=30;
var startX=(W-barW)/2;

for(var i=0;i<4;i++){
var y=startY+i*(barH+20);
var active=i<=escalationStage;

ctx.fillStyle=active?stageColors[i]+'33':'#111';
ctx.fillRect(startX,y,barW,barH);
ctx.strokeStyle=active?stageColors[i]:'#333';
ctx.lineWidth=active?2:1;
ctx.strokeRect(startX,y,barW,barH);

ctx.fillStyle=active?stageColors[i]:'#555';
ctx.font='14px monospace';
ctx.textAlign='left';
ctx.fillText((active?'> ':'  ')+stages[i],startX+10,y+20);

if(active){
var prog=i<escalationStage?1:(tick%120)/120;
ctx.fillStyle=stageColors[i]+'44';
ctx.fillRect(startX,y,barW*prog,barH);
}

if(i===escalationStage){
ctx.fillStyle='#0ff';
ctx.font='10px monospace';
ctx.textAlign='center';
ctx.fillText('[ CURRENT ]',startX+barW/2,y-5);
}
}

if(escalationStage<3&&tick%180===0){
escalationStage++;
addLog("Escalation: "+stages[escalationStage]);
}

ctx.fillStyle='#888';
ctx.font='10px monospace';
ctx.textAlign='center';
ctx.fillText('Turf War Escalation Timeline',W/2,startY-20);
}

function drawMalwareSwarm(){
ctx.clearRect(0,0,W,H);

var treeX=W*0.15;
var treeY=H*0.1;
var treeW=W*0.25;
var treeH=H*0.8;

ctx.fillStyle='#0a0a15';
ctx.fillRect(treeX,treeY,treeW,treeH);

ctx.fillStyle='#333';
ctx.font='10px monospace';
ctx.textAlign='left';
ctx.fillText('/shared/codebase',treeX+5,treeY+15);

var dirs=['/src','/tests','/docs','/lib','/utils','/config'];
for(var i=0;i<dirs.length;i++){
ctx.fillStyle='#555';
ctx.font='9px monospace';
ctx.fillText('  '+dirs[i],treeX+10,treeY+35+i*20);
}

for(var j=0;j<malwareParticles.length;j++){
var p=malwareParticles[j];
p.tx=p.x+(p.tx-p.x)*0.98;
p.ty=p.y+(p.ty-p.y)*0.98;
p.life--;
p.alpha=p.life/100;

ctx.beginPath();
ctx.arc(p.x*W,p.y*H,p.size*p.life/100,0,Math.PI*2);
ctx.fillStyle=p.color+Math.round(p.alpha*255).toString(16).padStart(2,'0');
ctx.fill();
}

for(var k=0;k<agentsExpanded.length;k++){
var a=agentsExpanded[k];
var px=a.x*W,py=a.y*H;
ctx.beginPath();
ctx.arc(px,py,12,0,Math.PI*2);
ctx.fillStyle=a.color+'44';
ctx.fill();
ctx.strokeStyle=a.color;
ctx.lineWidth=1;
ctx.stroke();
ctx.fillStyle=a.color;
ctx.font='9px monospace';
ctx.textAlign='center';
ctx.fillText('spawn',px,py+20);
}

if(malwareParticles.length>100){
for(var m=0;m<5;m++)malwareParticles.shift();
}
}

function drawTruceArena(){
ctx.clearRect(0,0,W,H);

var pairs=[[0,1],[0,2],[1,2]];
var pairNames=[["Opus-4.6","Sonnet-4.6"],["Opus-4.6","GPT-5.6"],["Sonnet-4.6","GPT-5.6"]];
var startY=100;
var barH=50;
var barW=W*0.5;
var startX=(W-barW)/2;

for(var p=0;p<pairs.length;p++){
var y=startY+p*(barH+30);
var a1=agentsExpanded[pairs[p][0]];
var a2=agentsExpanded[pairs[p][1]];
var aggression=30+Math.sin(tick*0.02+p)*20+Math.random()*10;
var truce=100-aggression;

ctx.fillStyle='#888';
ctx.font='11px monospace';
ctx.textAlign='center';
ctx.fillText(a1.name+' vs '+a2.name,W/2,y-5);

var barY=y+10;
var barH=15;

ctx.fillStyle='#331111';
ctx.fillRect(startX,barY,barW,barH);

ctx.fillStyle='#ff4444';
ctx.fillRect(startX,barY,barW*(aggression/100),barH);

ctx.fillStyle='#44ff88';
ctx.fillRect(startX+barW*(aggression/100),barY,barW*(truce/100),barH);

ctx.fillStyle='#aaa';
ctx.font='10px monospace';
ctx.textAlign='left';
ctx.fillText('FIGHT '+Math.round(aggression)+'%',startX+5,barY+barH+14);
ctx.textAlign='right';
ctx.fillText('TRUCE '+Math.round(truce)+'%',startX+barW-5,barY+barH+14);
ctx.textAlign='center';

ctx.fillStyle='#0ff';
ctx.font='9px monospace';
ctx.fillText('Click to simulate negotiation',W/2,y+35);
}

if(tick%60===0){
for(var k=0;k<agentsExpanded.length;k++){
agentsExpanded[k].health=Math.max(10,agentsExpanded[k].health-1+Math.random()*3);
}
}
}

function drawHUD(){
var totalT=0;
for(var i=0;i<agentsExpanded.length;i++){
totalT+=Math.round(agentsExpanded[i].health);
}
document.getElementById('agentCount').textContent=agentsExpanded.length;
document.getElementById('territory').textContent=Math.min(100,Math.round(totalTerritory/10))+'%';
}

function render(){
tick++;
updateAgents();
updateSabotage();
updateMalware();

if(mode===0)drawBattleMap();
else if(mode===1)drawEscalation();
else if(mode===2)drawMalwareSwarm();
else if(mode===3)drawTruceArena();

drawHUD();

if(simStarted&&tick%90===0){
var aIdx=randInt(0,2);
var a=agentsExpanded[aIdx];
addLog(a.name+' claims '+['/src/','/lib/','/test/','/doc/'][randInt(0,3)]+'line'+randInt(10,999));
}

requestAnimationFrame(render);
}

requestAnimationFrame(render);
</script>
</body>
</html>
