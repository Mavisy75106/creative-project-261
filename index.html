<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Hyperbezier Studio</title><style>body{margin:0;overflow:hidden;background:#060618;font-family:'Courier New',monospace;color:#c0c8e8}canvas{display:block;touch-action:none}#ui{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none}#controls{position:absolute;top:12px;left:12px;background:rgba(6,6,24,0.85);border:1px solid #1a2040;border-radius:8px;padding:12px;pointer-events:auto;min-width:200px;backdrop-filter:blur(4px)}#controls h2{margin:0 0 8px;font-size:14px;color:#8088ff;letter-spacing:2px}#controls label{display:block;margin:6px 0 2px;font-size:11px;color:#6068a0}#controls select,#controls input[type=range]{width:100%;pointer-events:auto;background:#0a0a20;color:#8088ff;border:1px solid #1a2040;border-radius:4px;padding:4px;font-size:11px;cursor:pointer}#controls input[type=range]{-webkit-appearance:none;height:6px;border-radius:3px}#controls input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#8088ff;cursor:pointer}#controls button{pointer-events:auto;background:#0a0a20;color:#8088ff;border:1px solid #1a2040;border-radius:4px;padding:6px 12px;font-size:11px;cursor:pointer;margin:2px;font-family:inherit;transition:border-color .2s}#controls button:hover{border-color:#8088ff}#controls button:active{background:#1a1a40}#stats{position:absolute;bottom:12px;right:12px;background:rgba(6,6,24,0.85);border:1px solid #1a2040;border-radius:8px;padding:10px;font-size:10px;pointer-events:auto;backdrop-filter:blur(4px);line-height:1.6}#stats span{color:#8088ff}.hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:10px;color:#404860;pointer-events:none;text-align:center}#mode-tabs{display:flex;gap:2px;margin:8px 0}#mode-tabs button{flex:1;text-align:center;font-size:10px;padding:4px 2px}.active{background:#1a1a40 !important;border-color:#8088ff !important}</style></head><body><canvas id="c"></canvas><div id="ui"><div id="controls"><h2>◆ HYPERBEZIER</h2><div id="mode-tabs"><button class="active" data-mode="4d">4D 投影</button><button data-mode="3d">3D 旋轉</button><button data-mode="morph">變異動畫</button><button data-mode="palette">色彩漸層</button></div><label>控制點數: <span id="cp-val">4</span></label><input type="range" id="cp" min="2" max="8" value="4" step="1"><label>維度投影: <span id="dim-val">3D</span></label><select id="dim"><option value="3">3D 透視投影</option><option value="2">2D 正交投影</option><option value="4">4D 立體投影</option></select><label>色彩模式</label><select id="palette"><option value="rainbow">彩虹光譜</option><option value="thermal">熱成像</option><option value="neon">霓虹光暈</option><option value="mono">單色光流</option></select><label>動畫速度: <span id="speed-val">1.0</span></label><input type="range" id="speed" min="0" max="3" value="1" step="0.1"><label>曲線粗細: <span id="width-val">2</span></label><input type="range" id="width" min="0.5" max="8" value="2" step="0.5"><div style="margin-top:8px"><button id="reset-btn">重置控制點</button><button id="screenshot-btn">截圖</button><button id="random-btn">隨機生成</button></div></div><div id="stats"><div>控制點: <span class="id" id="s-cp">4</span></div><div>曲線段數: <span class="id" id="s-seg">500</span></div><div>FPS: <span class="id" id="s-fps">60</span></div><div>投影模式: <span class="id" id="s-proj">4D→3D→2D</span></div><div>時間: <span class="id" id="s-time">0:00</span></div></div><div class="hint">拖曳旋轉 · 滾輪縮放 · 觸控滑動切換模式</div></div><script>(function(){'use strict';const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,cx,cy,MAX=Math.min(window.innerWidth,window.innerHeight);function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;cx=W/2;cy=H/2}window.addEventListener('resize',resize);resize();let mode='4d',dim=3,ctrlPts=4,paletteMode='rainbow',speedMul=1,widthMul=2;let rotX=0.4,rotY=0,rotZ=0,scale=1,morphT=0,startTime=Date.now();let fps=0,frameCount=0,lastFpsTime=performance.now();let dragging=false,lastMX=0,lastMY=0;const SEED=42;function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}const rng=mulberry32(SEED);function seededRandom(min,max){return min+rng()*(max-min)}function generateControlPoints(n){const pts=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2;const r=seededRandom(0.15,0.35);pts.push({x:Math.cos(a)*r,y:Math.sin(a)*r,z:seededRandom(-0.2,0.2),w:seededRandom(-0.3,0.3)})}return pts}let points=generateControlPoints(4);const SEGMENTS=500;function hyperbezier(t,pts){let x=0,y=0,z=0,w=0;for(let i=0;i<pts.length;i++){let b=bernstein(i,pts.length-1,t);x+=pts[i].x*b;y+=pts[i].y*b;z+=pts[i].z*b;w+=pts[i].w*b}return{x,y,z,w}}function bernstein(i,n,t){return comb(n,i)*Math.pow(t,i)*Math.pow(1-t,n-i)}function comb(n,k){if(k===0||k===n)return 1;let r=1;for(let i=0;i<k;i++)r=r*(n-i)/(i+1);return r}function rotate4D(x,y,z,w,rx,ry,rz){let c=Math.cos(rx),s=Math.sin(rx);let y1=y*c-z*s,z1=y*s+z*c;c=Math.cos(ry);s=Math.sin(ry);let x1=x*c+w*s;let w1=-x*s+w*c;y=y1;z=z1;const c2=Math.cos(rz),s2=Math.sin(rz);let x2=x1*c2-z1*s2,z2=x1*s2+z1*c2;x=x2;z=z2;return{x:x,y:y1,z:z2,w:w}}function project4Dto3D(x,y,z,w,depth){const d=3+(w>0?depth:0);return{x:x*d,y:y*d,z:z*d}}function project3Dto2D(x,y,z){const cosY=Math.cos(rotY),sinY=Math.sin(rotY),cosX=Math.cos(rotX),sinX=Math.sin(rotX);const x1=x*cosY+z*sinY;const z1=-x*sinY+z*cosY;const y1=y*cosX-z1*sinX;const z2=y*sinX+z1*cosX;const perspective=8;const scale2=perspective/(perspective+z2)*scale;return{x:x1*scale2,y:y1*scale2,z:z2}}function project4Dto2D(x,y,z,w){let r=rotate4D(x,y,z,w,rotX,rotY,rotZ);let p=project4Dto3D(r.x,r.y,r.z,r.w,1.5);return project3Dto2D(p.x,p.y,p.z)}function colorAt(t,type){let h,s,l;if(type==='rainbow'){h=(t*360+performance.now()*0.01)%360;s=80;l=55;return`hsl(${h},${s}%,${l}%)`}if(type==='thermal'){const v=t*4;const r=Math.min(255,Math.floor(v*2));const g=Math.min(255,Math.floor((v-1)*2.5));const b=Math.min(255,Math.floor((v-2)*3));return`rgb(${r},${g},${b})`}if(type==='neon'){const h=(t*720+performance.now()*0.005)%360;return`hsl(${h},100%,60%)`}const brightness=30+Math.sin(t*Math.PI*4)*20+25;return`rgba(${brightness+30},${brightness+40},${brightness+80},0.9)`}function drawCurve(pts,ptsPerSeg){const ptsArr=[];for(let i=0;i<=SEGMENTS;i++){const t=i/SEGMENTS;ptsArr.push(hyperbezier(t,pts))}if(ptsPerSeg<2)return;const segments=[];let si=0;while(si<ptsArr.length){const seg=[];const end=Math.min(si+ptsPerSeg,ptsArr.length);for(let j=si;j<end;j++)seg.push(ptsArr[j]);segments.push({pts:seg,startT:si/SEGMENTS});si+=ptsPerSeg}return segments}function drawSegment(seg){if(!seg||seg.pts.length<2)return;const col=colorAt(seg.startT,paletteMode);ctx.strokeStyle=col;ctx.lineWidth=widthMul;ctx.shadowColor=col;ctx.shadowBlur=4;ctx.beginPath();let started=false;for(let i=0;i<seg.pts.length;i++){const p=seg.pts[i];const px=cy+p.y;const py=cy+p.x;const ppx=cy+p.y;const ppy=cy+p.x;if(p.z>-5){if(!started){ctx.moveTo(ppx,ppy);started=true}else{ctx.lineTo(ppx,ppy)}}}ctx.stroke();ctx.shadowBlur=0}function drawControlPoints(pts){for(const p of pts){ctx.fillStyle='#8088ff';ctx.shadowColor='#8088ff';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(cy+p.y,cy+p.x,5*scale,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cy+p.y,cy+p.x,2,0,Math.PI*2);ctx.fill()}}function drawGrid(){ctx.strokeStyle='rgba(30,35,70,0.3)';ctx.lineWidth=0.5;const step=50;for(let x=0;x<W;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}}function drawParticles(pts){const count=30;const t=(Date.now()-startTime)*0.001*speedMul;for(let i=0;i<count;i++){const pt=hyperbezier((i%SEGMENTS)/SEGMENTS+((t+i*0.1)%1),pts);const proj=project4Dto2D(pt.x,pt.y,pt.z,pt.w);const alpha=0.3+Math.sin(t*2+i)*0.2;ctx.fillStyle=`rgba(128,136,255,${alpha})`;ctx.beginPath();ctx.arc(cy+proj.y*0.7,cy+proj.x*0.7,1.5,0,Math.PI*2);ctx.fill()}}function render4D(){drawGrid();ctx.save();ctx.translate(cx,cy);const morphPts=points.map((p,i)=>({x:p.x*Math.cos(morphT+i),y:p.y*Math.sin(morphT+i*0.7)+p.z*0.3,z:p.z+Math.sin(morphT*0.5+i)*0.1,w:p.w*Math.cos(morphT*0.3)}));const segs=drawCurve(morphPts,50);for(const seg of segs)drawSegment(seg);const cpts=morphPts.map(p=>project4Dto2D(p.x,p.y,p.z,p.w));for(let i=0;i<cpts.length-1;i+=2){const a=cpts[i],b=cpts[i+1];if(!a||!b)continue;ctx.strokeStyle='rgba(128,136,255,0.15)';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}ctx.restore();drawControlPoints(morphPts)}function render3D(){drawGrid();ctx.save();ctx.translate(cx,cy);const pts=points.map(p=>rotate4D(p.x,p.y,p.z,p.w,rotX,rotY,rotZ));const segs=drawCurve(pts,50);for(const seg of segs){const projected=seg.pts.map(p=>project3Dto2D(p.x,p.y,p.z));const avgZ=projected.reduce((s,p)=>s+p.z,0)/projected.length;const alpha=avgZ>-2?1:0.3;ctx.globalAlpha=alpha;const col=colorAt(seg.startT,paletteMode);ctx.strokeStyle=col;ctx.lineWidth=widthMul*alpha;ctx.shadowColor=col;ctx.shadowBlur=6;ctx.beginPath();let started=false;for(const p of projected){if(!started){ctx.moveTo(p.x,p.y);started=true}else ctx.lineTo(p.x,p.y)}ctx.stroke();ctx.shadowBlur=0}ctx.globalAlpha=1;ctx.restore();const cpts=points.map(p=>project3Dto2D(p.x,p.y,p.z));for(const p of cpts){if(!p)continue;ctx.fillStyle='#8088ff';ctx.shadowColor='#8088ff';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(p.x,p.y,5*scale,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}}function renderMorph(){drawGrid();ctx.save();ctx.translate(cx,cy);const morphPts=points.map((p,i)=>({x:p.x*Math.cos(morphT+i*0.3),y:p.y*Math.sin(morphT*0.7+i*0.5),z:p.z+Math.sin(morphT*0.2+i)*0.2,w:p.w*Math.cos(morphT*0.1+i*0.2)}));const segs=drawCurve(morphPts,50);for(const seg of segs)drawSegment(seg);ctx.restore();drawParticles(morphPts)}function renderPalette(){drawGrid();ctx.save();ctx.translate(cx,cy);const pts=points.map(p=>rotate4D(p.x,p.y,p.z,p.w,rotX*0.5,rotY*0.5,0));const curvePts=[];for(let i=0;i<=SEGMENTS;i++){const t=i/SEGMENTS;curvePts.push({t,...hyperbezier(t,pts)})}const segLen=30;let si=0;while(si<curvePts.length){const seg=curvePts.slice(si,Math.min(si+segLen,curvePts.length));const tAvg=seg.reduce((s,p)=>s+p.t,0)/seg.length;const col=colorAt(tAvg,paletteMode);ctx.strokeStyle=col;ctx.lineWidth=widthMul*3;ctx.shadowColor=col;ctx.shadowBlur=15;ctx.beginPath();for(let i=0;i<seg.length;i++){const p=project3Dto2D(seg[i].x,seg[i].y,seg[i].z);if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)}ctx.stroke();ctx.shadowBlur=0;si+=segLen}ctx.restore();drawControlPoints(pts)}let lastMode=mode;function render(){if(mode!==lastMode){lastMode=mode;updateUI()}ctx.fillStyle='#060618';ctx.fillRect(0,0,W,H);switch(mode){case'4d':render4D();break;case'3d':render3D();break;case'morph':renderMorph();break;case'palette':renderPalette();break}drawFPS()}function drawFPS(){frameCount++;const now=performance.now();if(now-lastFpsTime>1000){fps=frameCount;frameCount=0;lastFpsTime=now}}function updateUI(){const modeNames={fourD:'4D 投影',threeD:'3D 旋轉',morph:'變異動畫',palette:'色彩漸層'};document.querySelectorAll('#mode-tabs button').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode)});const projNames={3:'4D→3D→2D',2:'4D→3D→2D(正交)',4:'4D→3D→2D(立體)'};document.getElementById('s-proj').textContent=projNames[dim]||'4D→3D→2D'}function animate(){morphT+=0.005*speedMul;render();document.getElementById('s-cp').textContent=ctrlPts;document.getElementById('s-seg').textContent=SEGMENTS;document.getElementById('s-fps').textContent=fps;const elapsed=Date.now()-startTime;const m=Math.floor(elapsed/60000);const s=Math.floor((elapsed%60000)/1000);document.getElementById('s-time').textContent=m+':'+(s<10?'0':'')+s;requestAnimationFrame(animate)}function onMove(x,y){if(!dragging)return;const dx=x-lastMX,dy=y-lastMY;rotY+=dx*0.005;rotX+=dy*0.005;lastMX=x;lastMY=y}canvas.addEventListener('mousedown',e=>{dragging=true;lastMX=e.clientX;lastMY=e.clientY});canvas.addEventListener('mouseup',()=>{dragging=false});canvas.addEventListener('mousemove',e=>onMove(e.clientX,e.clientY));canvas.addEventListener('wheel',e=>{e.preventDefault();scale*=e.deltaY>0?0.95:1.05;scale=Math.max(0.1,Math.min(5,scale))},{passive:false});canvas.addEventListener('touchstart',e=>{if(e.touches.length===1){dragging=true;lastMX=e.touches[0].clientX;lastMY=e.touches[0].clientY}});canvas.addEventListener('touchmove',e=>{e.preventDefault();if(dragging&&e.touches.length===1){onMove(e.touches[0].clientX,e.touches[0].clientY)}},{passive:false});canvas.addEventListener('touchend',()=>{dragging=false});document.getElementById('cp').addEventListener('input',e=>{ctrlPts=parseInt(e.target.value);points=generateControlPoints(ctrlPts);document.getElementById('cp-val').textContent=ctrlPts});document.getElementById('dim').addEventListener('change',e=>{dim=parseInt(e.target.value);document.getElementById('dim-val').textContent={3:'3D',2:'2D',4:'4D'}[dim]||''});document.getElementById('palette').addEventListener('change',e=>{paletteMode=e.target.value});document.getElementById('speed').addEventListener('input',e=>{speedMul=parseFloat(e.target.value);document.getElementById('speed-val').textContent=speedMul.toFixed(1)});document.getElementById('width').addEventListener('input',e=>{widthMul=parseFloat(e.target.value);document.getElementById('width-val').textContent=widthMul.toFixed(1)});document.getElementById('reset-btn').addEventListener('click',()=>{rotX=0.4;rotY=0;rotZ=0;scale=1;points=generateControlPoints(ctrlPts)});document.getElementById('random-btn').addEventListener('click',()=>{points=generateControlPoints(ctrlPts)});document.getElementById('screenshot-btn').addEventListener('click',()=>{const link=document.createElement('a');link.download='hyperbezier-studio.png';link.href=canvas.toDataURL();link.click()});document.querySelectorAll('#mode-tabs button').forEach(btn=>{btn.addEventListener('click',()=>{mode=btn.dataset.mode;document.getElementById('mode-tabs').querySelectorAll('button').forEach(b=>b.classList.remove('active'));btn.classList.add('active')})});let touchStartTime=0;canvas.addEventListener('touchstart',e=>{touchStartTime=Date.now()},{once:false});let lastSwipeMode=mode;canvas.addEventListener('touchend',e=>{const elapsed=Date.now()-touchStartTime;if(elapsed<300){const modes=['4d','3d','morph','palette'];const idx=modes.indexOf(lastSwipeMode);const nextIdx=(idx+1)%modes.length;mode=modes[nextIdx];lastSwipeMode=mode;document.getElementById('mode-tabs').querySelectorAll('button').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode)})}});requestAnimationFrame(animate)}());</script></body></html>
